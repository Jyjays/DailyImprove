[project]
name = "dailyimprove"
version = "0.1.0"
description = "每日成长系统：插件化信息模块 + LLM 单轮筛选 + 微信/飞书推送 + 本地反馈"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10,<4",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "httpx>=0.26",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.pytest.ini_options]
pythonpath = ["."]
