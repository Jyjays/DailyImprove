key: ai-infra
name: AI Infra 技术动态
enabled: true
schedule: "0 9 * * *"
timezone: Asia/Shanghai
lifetime: persistent
max_items_per_run: 5
dedup:
  strategy: persistent
  cross_source: title_similarity
  title_similarity_threshold: 0.85
llm:
  model: ""
  temperature: 0.1
  batch_size: 5
  max_tokens: 8000
  threshold: 60
  profile: |
    主题范围：AI 系统中与数据布局、存储、IO、缓存、检索、推理调度和性能分析有关的工程材料。
    优先具体机制、实现细节和适用条件，说明与数据库/存储经验的关系。
    CUDA、算子、编译器与训练框架只是可选主题，不预设用户转向其中某一岗位。
    当前阶段、目标与暂停主题在运行时从共享上下文读取，不在这里固定学习路线。
    不要产品营销与无实现信息的新闻；只提供可选阅读，不安排每日任务。
filter:
  keywords_include: ["CUDA", "GPU", "kernel", "inference", "serving", "training", "quantization", "NCCL", "parallel", "compiler", "TVM", "MLIR", "throughput"]
  keywords_exclude: ["融资", "发布", "融资", "招聘"]
  min_content_length: 0
  lookback_hours: 168
sources:
  - name: NVIDIA Developer Blog
    type: rss
    url: "https://developer.nvidia.com/blog/feed/"
    base_weight: 1.2
    max_fetch: 20
  - name: PyTorch Blog
    type: rss
    url: "https://pytorch.org/feed"
    base_weight: 1.1
    max_fetch: 15
  - name: Hugging Face Blog
    type: rss
    url: "https://huggingface.co/blog/feed.xml"
    base_weight: 1.0
    max_fetch: 15
  - name: Google Research Blog
    type: rss
    url: "https://research.google/blog/rss/"
    base_weight: 0.9
    max_fetch: 15
  - name: Hacker News · CUDA
    type: rss
    url: "https://hnrss.org/newest?q=CUDA"
    base_weight: 0.8
    max_fetch: 15
  - name: arXiv · LLM 推理系统
    type: rss
    url: "https://export.arxiv.org/api/query?search_query=abs:%22inference%22+AND+abs:%22serving%22&start=0&max_results=30&sortBy=submittedDate&sortOrder=descending"
    base_weight: 1.0
    max_fetch: 15
push:
  channels: [file]
