key: drone-contest
name: 无人机算法竞赛 · 横向
enabled: true
schedule: "0 9 * * wed,sat"     # 每周三、周六 09:00，只在横向时间前推
timezone: Asia/Shanghai
lifetime: persistent
max_items_per_run: 4
dedup:
  strategy: persistent
  cross_source: title_similarity
  title_similarity_threshold: 0.85
llm:
  model: ""
  temperature: 0.1
  batch_size: 5
  max_tokens: 8000
  threshold: 55
  profile: |
    主题范围：无人机与自主导航的可复用开源工程、仿真方案和最小复现材料。
    不预设用户当前仍在开展横向，不固定每周投入；如无当前需求，仅作为可选资料。
    当前目标和偏好在运行时从共享上下文读取，不能自动恢复历史任务。
    摘要注明是否开源、仿真环境与硬件条件，不安排每日任务。
filter:
  keywords_include: ["drone", "UAV", "quadrotor", "aerial", "autonomous navigation", "path planning", "SLAM", "object tracking"]
  keywords_exclude: []
  min_content_length: 0
  lookback_hours: 336
sources:
  - name: arXiv · 无人机与自主导航
    type: rss
    url: "https://export.arxiv.org/api/query?search_query=abs:%22quadrotor%22+OR+abs:%22UAV%22&start=0&max_results=40&sortBy=submittedDate&sortOrder=descending"
    base_weight: 1.2
    max_fetch: 20
  - name: arXiv cs.RO 最新
    type: rss
    url: "http://export.arxiv.org/rss/cs.RO/"
    base_weight: 0.8
    max_fetch: 15
  - name: Hacker News · 无人机
    type: rss
    url: "https://hnrss.org/newest?q=drone"
    base_weight: 0.6
    max_fetch: 10
push:
  channels: [file]
