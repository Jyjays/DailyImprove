key: agent-memory-papers
name: Agent Memory 论文速览
enabled: true
schedule: "30 7 * * *"          # 每天 07:30，健身前推给手机看
timezone: Asia/Shanghai
lifetime: persistent            # 论文永久去重，推过不再推
max_items_per_run: 6
dedup:
  strategy: persistent
  cross_source: title_similarity
  title_similarity_threshold: 0.85
llm:
  model: ""
  temperature: 0.1
  batch_size: 5
  max_tokens: 8000
  threshold: 62
  profile: |
    主题范围：LLM Agent Memory，重点是存储开销、索引规模、增量更新、压缩、检索和维护代价。
    优先可复核的系统机制、公开代码、测量边界与局限；摘要说明与已有方法的关系。
    学术以毕业需要为底线，不预设用户每天读论文、找 idea 或追求发表。
    当前阶段与偏好在运行时从共享上下文读取；论文是按需资料，不转成学习作业。
filter:
  keywords_include: ["memory", "agent", "retrieval", "remember", "long-term"]
  keywords_exclude: ["memorization", "memory-efficient", "memory footprint"]
  min_content_length: 0
  lookback_hours: 96
sources:
  - name: arXiv · agent+memory 新论文
    type: rss
    url: "https://export.arxiv.org/api/query?search_query=abs:%22memory%22+AND+abs:%22agent%22&start=0&max_results=40&sortBy=submittedDate&sortOrder=descending"
    base_weight: 1.3
    max_fetch: 25
  - name: arXiv · LLM memory
    type: rss
    url: "https://export.arxiv.org/api/query?search_query=abs:%22large+language+model%22+AND+abs:%22memory%22&start=0&max_results=40&sortBy=submittedDate&sortOrder=descending"
    base_weight: 1.2
    max_fetch: 25
  - name: arXiv · 长上下文与检索增强
    type: rss
    url: "https://export.arxiv.org/api/query?search_query=abs:%22retrieval-augmented%22+OR+abs:%22long-term+conversation%22&start=0&max_results=40&sortBy=submittedDate&sortOrder=descending"
    base_weight: 0.9
    max_fetch: 20
  - name: arXiv cs.CL 最新
    type: rss
    url: "http://export.arxiv.org/rss/cs.CL/"
    base_weight: 0.7
    max_fetch: 20
  - name: arXiv cs.AI 最新
    type: rss
    url: "http://export.arxiv.org/rss/cs.AI/"
    base_weight: 0.6
    max_fetch: 20
  - name: 机器之心
    type: rss
    url: "https://www.jiqizhixin.com/rss"
    base_weight: 0.5
    max_fetch: 15
push:
  channels: [file]
