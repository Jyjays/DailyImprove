<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DailyImprove{% endblock %}</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; background:#f5f6fa; color:#222; }
    nav { background:#1e293b; padding:12px 24px; display:flex; gap:18px; align-items:center; }
    nav a { color:#e2e8f0; text-decoration:none; font-weight:600; }
    nav a:hover { color:#38bdf8; }
    .container { max-width:1100px; margin:24px auto; padding:0 16px; }
    .card { background:#fff; border-radius:12px; padding:18px 20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
    .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; }
    .ok { background:#dcfce7; color:#15803d; }
    .fail { background:#fee2e2; color:#b91c1c; }
    .run-btn { background:#2563eb; color:#fff; border:none; padding:6px 14px; border-radius:8px; cursor:pointer; }
    .run-btn:hover { background:#1d4ed8; }
    table { width:100%; border-collapse:collapse; background:#fff; }
    th, td { text-align:left; padding:10px 12px; border-bottom:1px solid #e2e8f0; vertical-align:top; }
    th { background:#f1f5f9; }
    .star { cursor:pointer; font-size:20px; color:#cbd5e1; }
    .star.on { color:#f59e0b; }
    code { background:#f1f5f9; padding:2px 6px; border-radius:4px; }
  </style>
</head>
<body>
<nav>
  <a href="/">概览</a>
  <a href="/sources">来源与反馈</a>
  <a href="/docs">API 文档</a>
</nav>
<div class="container">
{% block content %}{% endblock %}
</div>
</body>
</html>
